# Non-secret run parameters for the Discovery Engine pipeline.
# Secrets (GROQ_API_KEY) live only in .env, never here.

sources:
  play_store:
    package_id: "com.myntra.android"
    country: "in"
    lang: "en"
    # google_play_scraper.Sort enum names, tried in this order
    sort_orders: ["MOST_RELEVANT", "NEWEST"]

  app_store:
    # Myntra's iTunes trackId, confirmed via
    # https://itunes.apple.com/search?term=myntra&entity=software
    track_id: 907394059
    bundle_id: "com.myntra.Myntra"
    # Reviews are isolated per storefront — confirmed live that Myntra has
    # a real, distinct review pool on every one of these (likely Indian
    # diaspora reviewing from wherever they live). Excludes om/za/bd, which
    # returned zero reviews when checked.
    storefronts: [
      "in", "us", "gb", "ae", "ca", "au", "sg", "my", "nz", "qa", "sa", "kw",
      "bh", "ie", "de", "fr", "nl", "ch", "ke", "np", "lk", "pk", "it", "es",
      "se", "no", "dk", "fi", "jp", "kr",
    ]
    # Each sort order draws from an independent pool (confirmed live: page-1
    # review IDs under mostRecent and mostHelpful don't overlap at all), so
    # trying both roughly doubles unique coverage — same reasoning as Play
    # Store's multi-sort_orders list.
    sort_orders: ["mostRecent", "mostHelpful"]
    # iTunes RSS customer-reviews feed empirically stops returning pages
    # around 8-10 per sort order (confirmed live: page 9 consistently
    # returns empty across repeated runs) — a bit of headroom above that
    # observed ceiling, not a real expectation of reaching 15.
    max_pages: 15

  reddit:
    user_agent: "discovery-engine:v0.1 (by /u/myntra-discovery-research)"
    subreddits:
      - IndianFashionAddicts
      - IndianSkincareAddicts
      - india
      - IndianDankMemes
      - indianstreetwear
      - developersIndia   # occasional shopping/app-experience threads
      - shopping
    search_terms:
      - "myntra wishlist"
      - "myntra wish list"
      - "myntra save for later"
      - "myntra saved items"
      - "myntra return"
      - "myntra size"
      - "myntra fit"
      - "myntra review"
      - "myntra delivery"
      - "myntra vs ajio"
      - "myntra vs flipkart"
    # Rate limiting/retries are handled by prawcore internally (PRAW client),
    # not configured here.

  apify_reddit:
    # Supplements the collector above: PRAW's subreddit.search() is capped
    # at 100 results/call and restricted to the subreddits list above. This
    # collector instead runs an Apify actor to search the given terms
    # across ALL of Reddit (no subreddit whitelist) and can also surface
    # matching comments, which the submission-only PRAW collector never
    # sees. It writes to the same data/raw/reddit.jsonl file (source stays
    # "reddit" — see collectors/common.py's VALID_SOURCES), so rows are
    # deduped against the PRAW run by Reddit's own post/comment id.
    #
    # Actor input schemas change between Apify actor versions — before a
    # real run, confirm this actor's current input fields in the Apify
    # Console, or run `python collectors/apify_reddit.py --dry-run` to
    # print the resolved input without spending credits.
    actor_id: "trudax/reddit-scraper-lite"
    type: "posts"
    # Switched from "new" to "relevance" 2026-08-30: a "new"-sorted 2-term
    # run ("myntra" + "myntra wishlist") ran out of real, accessible Reddit
    # results at ~180 items total (finished naturally — "54 requests
    # succeeded" — well short of the configured cap) and surfaced 0 new
    # wishlist-relevant rows on a repeat attempt, so raising maxItems
    # alone can't unlock more content from that query pair. "relevance"
    # ranks each term's matches by topical fit rather than recency, which
    # for the newer decision-factor terms below should surface older,
    # substantive threads that "new" would never page back far enough to
    # reach.
    sort: "relevance"
    # Deliberately real, short (≤2-word) phrases only, never a longer
    # invented phrasing — confirmed live 2026-08-30 that Reddit's own
    # search returns zero real posts for most narrower multi-word wishlist
    # phrasings ("myntra wishlist" was the one exception found), and this
    # actor's behavior on a zero-match search is to fall back to crawling
    # unrelated subreddits (observed including NSFW ones) while still
    # billing per page visited — one 6-term batch of narrow phrases cost
    # $0.77 for effectively nothing. The terms after "myntra"/"myntra
    # wishlist" below are borrowed from the reddit.py (PRAW) collector's
    # own search_terms list — common decision-factor phrases already
    # judged plausible there — plus a few more of the same shape, to
    # diversify beyond the two queries that hit their ceiling. Wishlist
    # *scope* itself is enforced afterward in apify_reddit.py's run() by
    # requiring one of keyword_prefilter below (the same wishlist/save-
    # for-later vocabulary extract.py's Stage 2 filters on) in the row
    # text — so what reaches data/raw/reddit.jsonl is wishlist-specific
    # regardless of which term surfaced it.
    search_terms:
      - "myntra"
      - "myntra wishlist"
      - "myntra return"
      - "myntra size"
      - "myntra fit"
      - "myntra review"
      - "myntra delivery"
      - "myntra refund"
      - "myntra exchange"
      - "myntra order"
      - "myntra sale"
      - "myntra quality"

  youtube:
    # Official YouTube Data API v3 (see .env.example) — search.list finds
    # videos by keyword (no robots.txt concern, unlike scraping /results),
    # commentThreads.list reads public top-level comments. Both lists are
    # combined and de-duplicated by video id.
    seed_video_urls:
      - "https://www.youtube.com/watch?v=dcWh2RmeFkE"   # Myntra EORS lehenga sale unboxing & review
      - "https://www.youtube.com/watch?v=GzIzu9oemgU"   # Myntra shopping haul
      - "https://www.youtube.com/watch?v=rady1Z9Lwms"   # Myntra haul review, random shopping
      - "https://www.youtube.com/watch?v=rLYJoK7sLMs"   # Myntra vs Meesho try-on haul comparison
      - "https://www.youtube.com/watch?v=YZRobZ_eUIA"   # Myntra festive season try-on haul + styling tips
      - "https://www.youtube.com/watch?v=f8lVKmVj0pI"   # Myntra dress & bags sale haul
      - "https://www.youtube.com/watch?v=SRezH4EEBy8"   # Myntra dress haul
      - "https://www.youtube.com/watch?v=lqJCdc4IuQw"   # Myntra smart casuals haul
      - "https://www.youtube.com/watch?v=qP6KkeHwAbk"   # Myntra summer dresses haul
    search_queries:
      - "myntra wishlist"
      - "myntra save for later"
      - "myntra haul"
      - "myntra unboxing"
      - "myntra try on haul"
      - "myntra review"
      - "myntra app review"
      - "myntra shopping vlog"
    max_videos_per_query: 25

  forums:
    # Best-effort, lowest-volume source per architecture.md §3. MouthShut's
    # Myntra review pages block scraping (403) and DesiDime's own review
    # aggregator page is gone (410) — both checked live. DesiDime's
    # individual discussion threads below are real, reachable (200), and
    # robots.txt-allowed.
    seed_urls:
      - "https://www.desidime.com/discussions/myntra-has-cancelled-my-order-is-it-fair"
      - "https://www.desidime.com/discussions/myntra-refund-policy-changed-for-bank-discount-orders"
      - "https://www.desidime.com/discussions/urgent-myntra-product-exchange-concern"
      - "https://www.desidime.com/discussions/how-to-avoid-platform-fee-in-myntra"
      - "https://www.desidime.com/discussions/if-you-have-myntra-refer-code-then-you-get-free-shopping"

# Per-source cap on items collected in a single run.
item_caps:
  play_store: 500
  app_store: 20000
  reddit: 500
  # Set back down 2026-08-30 after confirming (twice, at higher caps) that
  # organic Reddit content specifically mentioning Myntra wishlist/save-
  # for-later behavior is close to exhausted at the current search_terms —
  # a 2600 cap and later a 1000 cap both self-terminated early (180 and
  # 215 items respectively) with zero new wishlist-relevant rows found.
  # Explicit user decision: stop spending further on this source and keep
  # the 42 rows already collected. This cap is intentionally left just
  # above that observed ceiling (~$0.0042/item, so ~$1 worst case) rather
  # than restored to a large number, so a future `run_all.py` invocation
  # doesn't unknowingly re-trigger a large paid pass.
  apify_reddit: 250
  youtube: 20000
  forums: 200

# Cheap pre-filter applied in Stage 2 before spending LLM budget.
# A row must contain at least one of these (case-insensitive) to survive.
#
# Narrowed to wishlist/save-for-later terms only — the broader
# purchase-decision list (size, fit, price, returns, ...) that architecture.md
# originally specified was scoped down per an explicit user decision to
# restrict final opportunity areas to items mentioning wishlist/save-for-later
# behavior (see synthesize.py's wishlist-scope filter). Extracting the other
# ~90% of the corpus just to discard it at Stage 4 was pure waste once that
# scope was fixed — this cuts Stage 3's workload accordingly. Trade-off:
# a plain keyword match will miss some wishlist-adjacent reviews phrased
# without these words (e.g. "decided to think it over"), which the broader
# filter + LLM judgment used to catch.
keyword_prefilter:
  - wishlist
  - wish list
  - save for later
  - saved for later
  - save it for later
  - saved item
  - save item
  - add to wishlist
  - added to wishlist
  - move to wishlist
  - moved to wishlist
  - shortlist
  - shortlisted
  - bookmark
  - bookmarked
  - buy later
  - purchase later

# Controlled vocabulary mirrored from problemStatement.md's decision-factor
# question list — used to constrain the `decision_factors` field in Stage 3.
decision_factors:
  - fit
  - price
  - reviews
  - occasion
  - styling
  - social_validation

# Groq model per stage. llama-3.1-8b-instant and llama-3.3-70b-versatile
# were retired from Groq (confirmed live via client.models.list() — both
# now 404 "does not exist or you do not have access to it"). Replaced with
# Groq's current GPT-OSS lineup, which are reasoning models — see
# extract.py/synthesize.py's `reasoning_effort="low"` calls, which keep
# reasoning-token overhead small and predictable for a structured
# extraction/classification task that doesn't need heavy reasoning.
#
# classification deliberately uses a DIFFERENT model than extraction.
# Confirmed live: Groq enforces a per-model tokens-per-day (TPD) cap on the
# on-demand tier — openai/gpt-oss-20b is capped at 200,000 tokens/day, and
# today's extract.py run alone (153,475 tokens) plus earlier synthesize
# attempts had already used 199,784/200,000 of it, so classification kept
# failing every batch regardless of batch size/pacing (that tuning only
# helps the separate per-minute limit, not a per-day one). gpt-oss-120b
# tracks its own independent TPD budget and had barely been touched today,
# so classification uses it instead rather than waiting out 20b's daily
# reset.
models:
  extraction: "openai/gpt-oss-20b"
  classification: "openai/gpt-oss-120b"

# Fixed opportunity-area taxonomy, per explicit user decision (they've done
# their own reading of the corpus and named these 11 themes directly, in
# place of open-ended HDBSCAN clustering + LLM cluster-naming). Stage 4
# classifies each extracted reason/blocker/info phrase into exactly one of
# these ids, or none — a phrase that doesn't clearly match one of these is
# dropped, not forced into the nearest theme or bucketed as "Other" (see
# synthesize.py's `_classify_phrases_into_themes`).
opportunity_themes:
  # Broadened 2026-08-30 per explicit user decision: the original
  # description only matched a literal "price went UP because I
  # wishlisted it" claim, which is a specific, rare accusation. Real
  # corpus content (esp. Reddit, which skews toward general shopping
  # narrative rather than narrow bug reports) much more often expresses
  # the same underlying frustration as "a sale/discount I expected on a
  # wishlisted item never happened" — a different sentence shape, same
  # broken-price-expectation problem. id/name kept stable so this reads
  # as a scope widening, not a new theme.
  - id: price_rise_after_wishlist
    name: "Price rise or no discount on wishlisted items"
    category: behavioral
    description: "An item's price increases after it was added to the wishlist, OR a sale/discount the user expected on a wishlisted or saved-for-later item never materializes. Both read as a broken price expectation that erodes trust in the price shown — not just the literal price-increase case."
  - id: pincode_not_serviceable
    name: "Pincode not serviceable after being added to wishlist"
    category: behavioral
    description: "A wishlisted item later shows as undeliverable/not serviceable to the user's pincode or location, blocking purchase even though the item is still listed."
  - id: out_of_stock_clutter
    name: "Out-of-stock items clutter the wishlist"
    category: behavioral
    description: "Sold-out items stay visible in the wishlist, cluttering it and making it harder to find the items that are actually still purchasable."
  - id: no_restock_notification
    name: "No notification when out-of-stock wishlist items are back in stock"
    category: behavioral
    description: "Users aren't alerted or notified when a wishlisted item that was out of stock becomes available again, so restocks are missed."
  - id: wishlist_capacity_limit
    name: "Wishlist capacity limit (max ~1000 items)"
    category: behavioral
    description: "Users hit a cap on how many items the wishlist can hold and are unable to add further items."
  # Broadened 2026-08-30 per explicit user decision: the original
  # description only matched the specific wishlist-mechanic failure (it
  # forgot a chosen size/color). Real corpus content much more often
  # expresses general fit/sizing/fabric-quality uncertainty about an item
  # someone has wishlisted or is deciding whether to buy — a related but
  # distinct signal that still blocks confident wishlist-to-purchase
  # conversion. id/name kept stable so this reads as a scope widening.
  - id: size_color_not_saved
    name: "Size/color/fit uncertainty for wishlisted items"
    category: behavioral
    description: "The wishlist doesn't remember the specific size/color the user intended when saving an item, OR the user expresses broader uncertainty or inconsistency about sizing, fit, or fabric quality for an item they've wishlisted or are deciding whether to purchase — both block confidently completing the purchase of a saved item."
  - id: missing_search_sort_filter
    name: "Missing search and sorting/filter options in the wishlist"
    category: behavioral
    description: "The wishlist offers no way to search, sort, or filter saved items, making it hard to navigate as the list grows."
  - id: login_required_to_wishlist
    name: "Need to log in in order to add to wishlist"
    category: behavioral
    description: "Users must log in or create an account before they can save an item to their wishlist, adding friction to a low-commitment action."
  - id: wishlist_disappears
    name: "Wishlist disappears"
    category: technical
    description: "Previously saved wishlist items vanish or get cleared unexpectedly — a technical, data-loss problem rather than a deliberate user action."
  - id: slow_wishlist_loading
    name: "Slow wishlist loading"
    category: technical
    description: "The wishlist page or screen takes a long time to load — a technical performance problem."
  - id: cart_addition_failure
    name: "Cart addition failures from wishlist prevent purchase conversion"
    category: technical
    description: "Moving or adding a wishlisted item to the cart fails or errors out, directly blocking the wishlist-to-purchase conversion it's meant to support."

synthesis:
  # Below this many total relevant extracted items, output is flagged as
  # not yet statistically meaningful (edge-case 9.3).
  min_relevant_items_for_confidence: 200
  # Mirrors extract.py's proven-reliable tuning (BATCH_SIZE=3,
  # PACING_SECONDS=15) — the classification task's structured-JSON output
  # is lighter than full extraction, so this stays comfortably under
  # openai/gpt-oss-20b's real ~8,000-tokens/minute ceiling (confirmed live
  # via response headers) whereas the previous, more talkative two-stage
  # relevance-filter design kept exhausting retries at this same pacing.
  classification_batch_size: 3
  classification_pacing_seconds: 15

# Approximate USD per 1M tokens, for the run-log cost estimate only — NOT
# verified against Groq's live pricing at time of writing. Check
# https://groq.com/pricing before trusting these numbers for a real budget
# decision; treat the run log's "estimated cost" as directional, not exact.
pricing:
  openai/gpt-oss-20b:
    input_per_million: 0.075
    output_per_million: 0.30
  openai/gpt-oss-120b:
    input_per_million: 0.15
    output_per_million: 0.60
